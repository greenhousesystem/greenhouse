<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Szklarnia IoT</title>

    <!-- MQTT WebSockets -->
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body { font-family: Arial; padding: 20px; }
        h1 { color: #2a7; }
    </style>
</head>

<body>
    <h1>🌱 Szklarnia – Live Dashboard</h1>

    <canvas id="tempChart" width="400" height="200"></canvas>

    <h2>Sterowanie</h2>
    <button onclick="sendCommand('LED_ON')">Włącz LED</button>
    <button onclick="sendCommand('LED_OFF')">Wyłącz LED</button>

    <script>
        // Połączenie MQTT WebSockets
        const client = mqtt.connect("wss://broker.hivemq.com:8884/mqtt");

        client.on("connect", () => {
            console.log("Połączono z MQTT");
            client.subscribe("szklarnia/dane");
        });

        // Wykres temperatury
        const ctx = document.getElementById("tempChart").getContext("2d");
        const tempChart = new Chart(ctx, {
            type: "line",
            data: {
                labels: [],
                datasets: [{
                    label: "Temperatura",
                    data: [],
                    borderColor: "red",
                    borderWidth: 2
                }]
            }
        });

        // Odbiór danych z ESP32
        client.on("message", (topic, message) => {
            const data = JSON.parse(message.toString());
            console.log("Dane:", data);

            tempChart.data.labels.push(new Date().toLocaleTimeString());
            tempChart.data.datasets[0].data.push(data.temp);
            tempChart.update();
        });

        // Wysyłanie komend do ESP32
        function sendCommand(cmd) {
            client.publish("szklarnia/komendy", cmd);
            console.log("Wysłano:", cmd);
        }
    </script>
</body>
</html>
